name: update dashboard data

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 04:17 UTC. Manual runs remain available from the Actions tab.
    - cron: "17 4 * * 1-5"

permissions:
  contents: write

concurrency:
  group: dashboard-ingestion
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r ingest/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s ingest -p "test_*.py" -v
      - name: Collect approved sources
        run: python ingest/collect.py
      - name: Build intelligence layer
        run: python ingest/intelligence.py
      - name: Upload generated data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: docs/data/
          retention-days: 30
      - name: Commit generated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "No dashboard data changes."
          else
            git commit -m "data: update dashboard sources"
            git push
          fi
