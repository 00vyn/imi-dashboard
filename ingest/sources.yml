# Active source registry for the Investment Management Intelligence Hub.
#
# This file contains only sources that passed the Step 1 probe on 2026-09-03,
# plus two GlobeNewswire feeds added 2026-09-04 to cover Investment
# Management and Deals, checked live via web_fetch rather than probe.py's
# own harness (see the comment above each entry). Weak, failed, and
# robots-disallowed sources are deliberately absent. SEC EDGAR is deferred
# until the company-research phase.
#
# It is configuration only: collectors and page rendering come in later steps.
schema_version: 1

sources:
  - id: fed-press
    name: Federal Reserve press releases
    kind: feed
    region: US
    tier: 1
    url: https://www.federalreserve.gov/feeds/press_all.xml
    ingest:
      mode: feed
      item_limit: 20

  - id: ecb-press
    name: European Central Bank press
    kind: feed
    region: EU
    tier: 1
    url: https://www.ecb.europa.eu/rss/press.html
    ingest:
      mode: feed
      item_limit: 15

  - id: marketwatch-top
    name: MarketWatch top stories
    kind: feed
    region: US
    tier: 2
    url: https://feeds.content.dowjones.io/public/rss/mw_topstories
    ingest:
      mode: feed
      item_limit: 10

  - id: ionnews
    name: ION News
    kind: feed
    region: MU
    tier: 3
    url: https://ionnews.mu/feed/
    ingest:
      mode: feed
      item_limit: 12

  - id: bom-feed
    name: Bank of Mauritius news
    kind: feed
    region: MU
    tier: 1
    url: https://www.bom.mu/rss.xml
    ingest:
      mode: feed
      item_limit: 10

  - id: sem-indices
    name: SEM indices
    kind: html
    region: MU
    tier: 1
    url: https://www.stockexchangeofmauritius.com/products-market-data/indices
    ingest:
      mode: html
      checks:
        - label: SEMDEX
          anchor: SEMDEX
          min: 500
          max: 10000
          baseline: 2299.81
        - label: SEM-ASI
          anchor: SEM-ASI
          min: 200
          max: 10000
          baseline: 2050.6
        - label: SEMTRI
          anchor: SEMTRI
          min: 1000
          max: 100000
          baseline: 11323.77
        - label: SEM10
          anchor: SEM10
          min: 50
          max: 5000
          baseline: 437.65

  - id: sem-announcements
    name: SEM announcements
    kind: html
    region: MU
    tier: 1
    url: https://www.stockexchangeofmauritius.com/
    ingest:
      mode: html
      checks: []

  - id: bom-rates
    name: Bank of Mauritius rates
    kind: html
    region: MU
    tier: 1
    url: https://www.bom.mu/
    ingest:
      mode: html
      checks:
        - label: KeyRate
          anchor: Key Rate
          min: 0
          max: 20
          baseline: 4.75
        - label: OvernightInterbank
          anchor: Overnight Interbank Rate
          min: 0
          max: 20
          baseline: 3.45

  - id: frankfurter
    name: Frankfurter exchange rates
    kind: api
    region: GLOBAL
    tier: 2
    ingest:
      mode: json
      endpoints:
        - id: currencies
          url: https://api.frankfurter.dev/v2/currencies
          expect_keys: [USD, EUR, GBP, MUR]
        - id: usd-rates
          url: https://api.frankfurter.dev/v2/rates?base=USD&quotes=EUR,GBP,JPY
          expect_keys: []

  # Added 2026-09-04. Fills the two categories the original nine sources
  # never touched: fund/asset-management news and M&A. Checked live
  # (web_fetch, outside this collector's own robots.txt gate) on
  # 2026-09-03: 20 entries each, newest same day, valid RSS. collect.py's
  # own Fetcher.robots_allows() still gates every fetch at run time, so a
  # disallowed path here is skipped and reported, not fetched.
  - id: globenewswire-ma
    name: GlobeNewswire Mergers and Acquisitions
    kind: feed
    region: GLOBAL
    tier: 2
    url: "https://www.globenewswire.com/RssFeed/subjectcode/27-Mergers%20and%20Acquisitions/feedTitle/GlobeNewswire%20-%20Mergers%20and%20Acquisitions"
    ingest:
      mode: feed
      item_limit: 20

  - id: globenewswire-funds
    name: GlobeNewswire Investment Fund Information
    kind: feed
    region: GLOBAL
    tier: 2
    url: "https://www.globenewswire.com/RssFeed/subjectcode/80-Investment%20Fund%20Information/feedTitle/GlobeNewswire%20-%20Investment%20Fund%20Information"
    ingest:
      mode: feed
      item_limit: 20
